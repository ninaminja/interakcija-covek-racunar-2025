version: "3.1"

rules:
- rule: Say hello world
  steps:
  - intent: hello_world
  - action: action_hello_world

- rule: Show latest toys
  steps:
  - intent: latest_toys
  - action: action_latest_toys

- rule: Search toys
  steps:
  - intent: search_toys
  - action: action_better_search

- rule: Show toy types
  steps:
  - intent: type_list
  - action: action_type_list

- rule: Show age groups
  steps:
  - intent: age_group_list
  - action: action_age_group_list

- rule: Show toy details
  steps:
  - intent: toy_details
  - action: action_extract_toy

- rule: Say goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Bot challenge
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Place order
  steps:
  - intent: place_order
  - action: action_place_order